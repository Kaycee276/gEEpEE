name: gEEpEE Continuous Integration Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Lint, Typecheck & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pycodestyle
          pip install sibyl-memory-client web3 fastapi uvicorn requests pydantic

      - name: Python Syntax & Compilation Verification
        run: |
          python -m py_compile backend/geepee_memory.py
          python -m py_compile backend/base_agent.py
          python -m py_compile backend/virtuals_acp.py
          python -m py_compile backend/agent_brain.py
          python -m py_compile backend/server.py

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run Backend Engine Health Check
        run: |
          python -c "
          from backend.geepee_memory import GeePeeMemoryEngine
          from backend.base_agent import BaseNetworkAgent
          from backend.virtuals_acp import VirtualsACPProtocol
          from backend.agent_brain import GeePeeAgentBrain

          mem = GeePeeMemoryEngine('/tmp/ci_test.db')
          base = BaseNetworkAgent()
          acp = VirtualsACPProtocol()
          brain = GeePeeAgentBrain(mem, base, acp)

          res = brain.run_rebalance_cycle()
          assert res['success'] == True
          print('CI Backend Health Check PASSED successfully!')
          "

  frontend-ci:
    name: Frontend Lint, Typecheck, Format & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Oxlint Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run Prettier Format Check
        working-directory: ./frontend
        run: npm run format:check

      - name: Run Production Build
        working-directory: ./frontend
        run: npm run build
